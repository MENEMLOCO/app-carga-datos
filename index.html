<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Extrusión</title>
<meta name="theme-color" content="#0F6FDE">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E8EBF1; --bg:#F6F7FB; --surface:#FFFFFF; --surface-2:#F3F4F8;
  --ink:#2B2D35; --ink-2:#676B7A; --line:#E3E6ED; --line-2:#CDD2DE;
  --primary:#0F6FDE; --primary-hover:#0B5DBD; --primary-soft:#E8F1FD; --primary-ink:#0B5DBD; --on-primary:#FFFFFF;
  --ok:#0E8A5A; --ok-soft:#E3F5EC; --bad:#D23A52; --bad-soft:#FCEBEE; --warn:#F2A53A; --warn-soft:#FFF4E1; --warn-ink:#8A5300;
  --pill-ok:#0E8A5A; --pill-bad:#D23A52; --pill-warn:#FDAB3D; --pill-warn-ink:#3B2600; --pill-mute:#E1E4EB; --pill-mute-ink:#4B4F5E;
  --frame:#1C1F26; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05); --focus:#0F6FDE;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0C0E13; --bg:#16191F; --surface:#1E222A; --surface-2:#262A33;
    --ink:#E7E9EF; --ink-2:#9DA3B3; --line:#2F3440; --line-2:#3C4250;
    --primary:#3D8EF0; --primary-hover:#5A9FF2; --primary-soft:#1A2A42; --primary-ink:#8EBDF7; --on-primary:#FFFFFF;
    --ok:#3CC98A; --ok-soft:#173326; --bad:#F06A80; --bad-soft:#3A1E25; --warn:#F2A53A; --warn-soft:#3A2C14; --warn-ink:#F5C072;
    --pill-mute:#343A47; --pill-mute-ink:#C9CDD8;
    --frame:#05070A; --shadow:0 1px 2px rgba(0,0,0,.4); --focus:#5A9FF2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --page:#0C0E13; --bg:#16191F; --surface:#1E222A; --surface-2:#262A33;
  --ink:#E7E9EF; --ink-2:#9DA3B3; --line:#2F3440; --line-2:#3C4250;
  --primary:#3D8EF0; --primary-hover:#5A9FF2; --primary-soft:#1A2A42; --primary-ink:#8EBDF7; --on-primary:#FFFFFF;
  --ok:#3CC98A; --ok-soft:#173326; --bad:#F06A80; --bad-soft:#3A1E25; --warn:#F2A53A; --warn-soft:#3A2C14; --warn-ink:#F5C072;
  --pill-mute:#343A47; --pill-mute-ink:#C9CDD8;
  --frame:#05070A; --shadow:0 1px 2px rgba(0,0,0,.4); --focus:#5A9FF2;
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.cond{font-variant-numeric:tabular-nums}
button,input,select{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.wrap{max-width:1240px;margin:0 auto;padding:40px 20px 72px}
.intro h1{font-weight:700;font-size:clamp(1.8rem,4vw,2.4rem);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
.intro p{margin:0 0 24px;max-width:66ch;color:var(--ink-2);font-size:1rem}

.tablet{position:relative;background:var(--frame);border-radius:28px;padding:12px;box-shadow:0 30px 70px -30px rgba(0,0,0,.6)}
.screen{position:relative;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;height:100vh;height:100dvh}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}


/* Barra superior */
.bar{display:flex;align-items:stretch;gap:20px;padding:0 20px;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);min-height:60px;flex-wrap:wrap}
.bar>*{align-self:center}
.bar .maq{font-size:1rem;font-weight:600;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;min-height:40px}
.nav{display:flex;gap:4px;align-self:stretch}
.nav button{border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:.95rem;padding:0 14px;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:60px}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--primary);box-shadow:inset 0 -3px 0 var(--primary)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.bar .who{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:600;font-size:.95rem}
.bar .clock{font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:500}
.avatar{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;font-size:.85rem}
.avatar.lg{width:52px;height:52px;font-size:1.25rem}

/* Base */
.body{flex:1;padding:20px 24px;display:flex;flex-direction:column;gap:16px;overflow:auto;min-height:0}
.body.withtab{padding-right:64px}
.q{font-weight:650;font-size:1.45rem;line-height:1.2;margin:0;letter-spacing:-.015em}
h3{font-size:.95rem;font-weight:600;margin:4px 0 0;color:var(--ink)}
.hint{margin:0;color:var(--ink-2);font-size:.92rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.col{display:flex;flex-direction:column;gap:12px}

.btn{min-height:46px;padding:0 18px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:.95rem;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.go{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.go:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.huge{min-height:56px;font-size:1.02rem;padding:0 28px}
.btn.small{min-height:36px;padding:0 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;font-size:.95rem;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:var(--primary-soft);color:var(--primary-ink);font-weight:600}
.tag{display:inline-flex;align-items:center;justify-content:center;padding:4px 10px;border-radius:4px;font-weight:600;font-size:.8rem;white-space:nowrap}
.tag.ok{background:var(--pill-ok);color:#fff}
.tag.warn{background:var(--pill-warn);color:var(--pill-warn-ink)}
.tag.bad{background:var(--pill-bad);color:#fff}
.tag.mute{background:var(--pill-mute);color:var(--pill-mute-ink)}
.lote{font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem;background:var(--surface-2);border:1px solid var(--line);padding:4px 10px;border-radius:6px}
.big{font-variant-numeric:tabular-nums;font-size:clamp(2.4rem,6vw,3.4rem);font-weight:700;line-height:1;letter-spacing:-.02em}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchips span{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:.84rem;color:var(--ink-2)}

/* Trabajos pendientes */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);padding:3px;border-radius:8px}
.seg button{min-height:36px;padding:0 14px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);font-weight:600;font-size:.9rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{flex:1;min-width:220px;min-height:42px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:.95rem;padding:0 14px}
.grouphead{display:flex;align-items:center;gap:10px;color:var(--primary);font-weight:650;font-size:1.05rem;margin-bottom:-6px}
.grouphead i{width:4px;height:18px;border-radius:2px;background:var(--primary)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);flex:1;min-height:0;box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:960px}
th{position:sticky;top:0;z-index:1;background:var(--surface);text-align:left;font-size:.78rem;color:var(--ink-2);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:.92rem}
tbody tr td:first-child{box-shadow:inset 4px 0 0 var(--primary)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tr.active td{background:var(--primary-soft)}
td.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
td small{display:block;color:var(--ink-2);font-size:.8rem}
td .tag{min-width:92px;padding:6px 10px}
td:last-child{white-space:nowrap}
td:last-child .tag{display:flex;width:max-content;min-width:120px}
td:last-child .tag+.tag{margin-top:4px}

/* Paneles laterales y hojas */
.back{position:absolute;inset:0;background:rgba(12,15,22,.45);z-index:5}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(460px,94%);z-index:6;background:var(--surface);padding:20px 22px;display:flex;flex-direction:column;gap:12px;overflow:auto;box-shadow:-16px 0 40px -16px rgba(0,0,0,.35);border-left:1px solid var(--line)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-radius:16px 16px 0 0;padding:20px 24px;display:flex;flex-direction:column;gap:12px;max-height:92%;overflow:auto;box-shadow:0 -16px 40px -16px rgba(0,0,0,.35)}
.dl{display:grid;grid-template-columns:1fr 1.3fr;gap:8px 14px;margin:0;font-size:.9rem}
.dl dt{color:var(--ink-2)}
.dl dd{margin:0;font-weight:600;word-break:break-word}
.group{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.group h3{margin:0 0 10px}

/* Carga */
.cgrid{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;align-items:start}
.weighgrid{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:56px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums;font-size:1.4rem;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.pad button:hover{background:var(--surface-2)}
.pad button:active{background:var(--primary-soft);border-color:var(--primary)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 12px}
.field.req{box-shadow:inset 3px 0 0 var(--warn)}
.field.req.filled{box-shadow:inset 3px 0 0 var(--ok)}
.field span{font-size:.8rem;color:var(--ink-2)}
.field input{border:0;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums;font-size:1.25rem;font-weight:600;width:100%;padding:0}
.field input:focus{outline:none}
.field:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.rec{background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 25%,transparent);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.rec.none{background:var(--surface-2);border-color:var(--line)}
.footbar,.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;border-top:1px solid var(--line);background:var(--surface)}
.footbar .status{font-weight:600;font-size:.92rem;color:var(--ink-2)}
.footbar .status.okk{color:var(--ok)}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.9rem}
.mini li b{font-variant-numeric:tabular-nums}
.adbox{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.scraptab{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:4;writing-mode:vertical-rl;background:var(--ink);color:var(--surface);border:0;border-radius:10px 0 0 10px;padding:18px 11px;font-weight:600;font-size:.92rem;letter-spacing:.02em;cursor:pointer;box-shadow:-4px 0 16px -6px rgba(0,0,0,.35)}
.scraptab b{display:inline-block;margin-top:10px;color:var(--warn)}

/* Asistente */
.prog{display:flex;list-style:none;margin:0;padding:18px 24px 6px;background:var(--surface);border-bottom:1px solid var(--line)}
.prog li{flex:1;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;padding-bottom:12px}
.prog li::after{content:"";position:absolute;top:13px;left:34px;right:6px;height:2px;background:var(--line)}
.prog li:last-child::after{display:none}
.prog li.done::after{background:var(--primary)}
.prog .sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-weight:700;font-size:.8rem;position:relative;z-index:1}
.prog .sl{font-size:.8rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.prog li.done .sn{background:var(--primary);border-color:var(--primary);color:#fff}
.prog li.cur .sn{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.prog li.cur .sl{color:var(--ink);font-weight:600}
.ctxline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 24px 0;color:var(--ink-2);font-size:.92rem}
.ctxline b{color:var(--ink)}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.opt{min-height:60px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:1rem;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s}
.opt:hover{border-color:var(--line-2)}
.opt[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary);background:var(--primary-soft)}
.op{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 12px;text-align:center}
.grid4 .op:nth-child(4n+1) .avatar{background:#579BFC}
.grid4 .op:nth-child(4n+2) .avatar{background:#9D5CD6}
.grid4 .op:nth-child(4n+3) .avatar{background:#0E9F8E}
.grid4 .op:nth-child(4n+4) .avatar{background:#E8697D}
.list{display:flex;flex-direction:column;gap:8px}
.pcard{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center;width:100%;padding:12px 16px;min-height:0;box-shadow:inset 4px 0 0 var(--primary),var(--shadow)}
.pcard[aria-pressed="true"]{box-shadow:inset 4px 0 0 var(--primary),0 0 0 1px var(--primary)}
.pcard .pn{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}
.pcard small{display:block;color:var(--ink-2);font-weight:500;font-size:.85rem}
.pcard .pp{color:var(--ink-2);font-weight:500;text-align:right;font-size:.85rem;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ro{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px 22px;margin:0;background:var(--surface);border:1px solid var(--line);padding:18px 20px;border-radius:12px;box-shadow:var(--shadow)}
.ro dt{font-size:.78rem;color:var(--ink-2)}
.ro dd{margin:3px 0 0;font-weight:600;font-size:.95rem;word-break:break-word}
.ro dd.cond{font-size:1.15rem;font-variant-numeric:tabular-nums}
.ro .wide{grid-column:1/-1}
.fbox{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow)}
.fbox.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.fbox .fl{font-size:.8rem;color:var(--ink-2)}
.fbox .fv{font-size:2rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.fbox .fv small{font-size:.95rem;color:var(--ink-2);font-weight:500}
.pesos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--shadow)}
.pbox:first-child{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.pbox .hint{font-size:.8rem}
.pbox .mid{font-variant-numeric:tabular-nums;font-size:clamp(1.9rem,4vw,2.5rem);font-weight:700;line-height:1.05;letter-spacing:-.02em}
.pbox .mid small{font-size:.95rem;color:var(--ink-2);font-weight:500;letter-spacing:0}
.pbox .sm{font-size:.78rem}
.pbox.dev.ok{box-shadow:inset 0 3px 0 var(--ok),var(--shadow)}
.pbox.dev.ok .mid{color:var(--ok)}
.pbox.dev.bad{box-shadow:inset 0 3px 0 var(--bad),var(--shadow)}
.pbox.dev.bad .mid{color:var(--bad)}
.errbox,.okbox,.warnbox{border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.errbox{background:var(--bad-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);border-left:4px solid var(--bad)}
.errbox b{color:var(--bad)}
.okbox{background:var(--ok-soft);color:var(--ok);border-left:4px solid var(--ok)}
.warnbox{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn)}
.warnbox b{color:var(--warn-ink)}
.pin{min-height:36px;width:180px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:1rem;padding:0 12px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;flex:1}

.field.stp{padding:8px 10px}
.stpr{display:flex;align-items:center;gap:6px}
.stpr input{text-align:center;font-size:1.3rem;min-width:0;flex:1}
.sb{width:40px;height:40px;flex:none;border-radius:8px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font-size:1.3rem;font-weight:600;cursor:pointer;line-height:1}
.sb:hover{background:var(--surface)}
.sb:active{background:var(--primary-soft);border-color:var(--primary)}
.fields.stps{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.pbox.dev.warn{box-shadow:inset 0 3px 0 var(--warn),var(--shadow)}
.pbox.dev.warn .mid{color:var(--warn-ink)}
.tablewrap.flat{box-shadow:none;flex:none}
table.tight{min-width:760px}
.tablewrap.flat tbody tr{cursor:default}
.tablewrap.flat tbody tr td:first-child{box-shadow:inset 4px 0 0 var(--ok)}
.tablewrap.flat tbody tr.flag td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
.tablewrap.flat tbody tr.flag td{background:var(--bad-soft)}

/* Etiqueta con QR */
.savedgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center;flex:1}
.savedgrid .col>.btn{align-self:flex-start}
.labelprev{margin:0;background:#fff;color:#111;border-radius:6px;padding:16px 18px;aspect-ratio:2/1;max-width:560px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 34px -18px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.08);font-family:'Figtree',system-ui,sans-serif}
.lb-head{display:flex;justify-content:space-between;font-weight:700;font-size:.82rem;border-bottom:2px solid #111;padding-bottom:6px}
.lb-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;flex:1;min-height:0}
.lb-lote{font-size:clamp(1.4rem,3.2vw,2.1rem);font-weight:800;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-bottom:8px;white-space:nowrap}
.lb-data dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 10px;margin:0;font-size:.82rem}
.lb-data dt{color:#555}
.lb-data dd{margin:0;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-qr{display:flex;flex-direction:column;align-items:center;gap:4px}
.lb-qr svg{width:clamp(96px,14vw,136px);height:auto;display:block}
.lb-qr svg rect[fill="white"],.lb-qr svg rect[fill="#ffffff"]{fill:#fff}
.lb-qr span{font-size:.68rem;font-weight:600;color:#333;font-variant-numeric:tabular-nums}
@media (max-width:820px){.savedgrid{grid-template-columns:minmax(0,1fr)}.labelprev{aspect-ratio:auto}}
.regtable table{min-width:max-content}
.regtable th.newcol{color:var(--primary-ink);background:var(--primary-soft)}
.regtable td{white-space:nowrap;font-variant-numeric:tabular-nums;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.regtable tbody tr{cursor:default}
.maqname{font-weight:650;font-size:1rem;white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink-2);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line-2)}
.sdot.ok{background:var(--ok)}.sdot.warn{background:var(--warn)}.sdot.bad{background:var(--bad)}
.gear{min-width:40px;min-height:40px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:1.15rem;cursor:pointer}
.gear[aria-current="page"]{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.cfg{max-width:640px;width:100%;margin:0 auto}
.cfg .field input{font-size:1rem;font-weight:500;font-family:inherit}
.cfgmsg{font-weight:600;color:var(--ink)}
.qrwait{width:clamp(96px,14vw,136px);aspect-ratio:1;border:2px dashed #bbb;border-radius:6px;display:grid;place-items:center;text-align:center;font-size:.68rem;color:#666;padding:8px;line-height:1.3}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2B2D35;color:#fff;padding:12px 18px;border-radius:8px;font-weight:600;font-size:.92rem;z-index:20;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:90%}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:28px}
.notes h3{font-size:1rem;margin:0 0 6px}
.notes p{margin:0;color:var(--ink-2);font-size:.92rem}

@media (max-width:820px){
  .tablet{padding:8px;border-radius:22px}
  .cgrid,.weighgrid,.notes{grid-template-columns:1fr}
  .pesos{grid-template-columns:1fr 1fr}
  .prog .sl{display:none}
  .prog li.cur .sl{display:block}
  .body{padding:16px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- conexión con el Sheets ---------- */
const MOT_CAMBIO = ['Cambio de material', 'Cambio de color'];
const up = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
const n2 = v => Math.round(v * 100) / 100;
const mes = d => `${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
const colorDe = r => { const a = parseAdit(r[K.adit]); return a ? `${a.code} - ${a.comps.map(x => x.n).join(' + ')}` : 'Sin aditivo'; };
const dosDe = r => { const a = parseAdit(r[K.adit]); const m = a && a.dos.match(/[\d.,]+/); return m ? num(m[0]) : ''; };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
/* Cola de envíos: si no hay conexión, las cargas quedan guardadas en la tablet y se mandan solas cuando vuelve. */
const OUTBOX = store.get('outbox', []);
const LOTES = store.get('lotes-asignados', {});
const SYNC = {busy: false, err: '', hora: store.get('cache-hora', ''), loading: false};
const saveOut = () => { store.set('outbox', OUTBOX); store.set('lotes-asignados', LOTES); };

async function api(accion, datos) {
  if (!CFG.url) throw new Error('Falta configurar la conexión');
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 30000);
  try {
    const res = await fetch(CFG.url, {method: 'POST', body: JSON.stringify({accion, clave: CFG.clave, datos: datos || {}}), signal: ctrl.signal});
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'El Sheets respondió con un error');
    return j;
  } catch (e) {
    if (e.name === 'AbortError' || e instanceof TypeError) throw new Error('Sin conexión con el Sheets');
    throw e;
  } finally { clearTimeout(t); }
}
function syncText() {
  if (!CFG.url) return '<span class="sdot bad"></span>Sin configurar';
  const n = OUTBOX.length;
  if (SYNC.busy && n) return `<span class="sdot warn"></span>Enviando ${n}…`;
  if (n) return `<span class="sdot bad"></span>${SYNC.err || 'Sin conexión'}: ${n === 1 ? '1 envío pendiente' : n + ' envíos pendientes'}`;
  if (SYNC.err) return `<span class="sdot bad"></span>${SYNC.err}`;
  return '<span class="sdot ok"></span>Sincronizado';
}
function updSync() { const el = document.getElementById('sync'); if (el) el.innerHTML = syncText(); }
async function cargarPendientes(manual) {
  if (!CFG.url || SYNC.loading) return;
  SYNC.loading = true; if (S.view === 'pend') render();
  try {
    const j = await api('pendientes');
    ROWS = j.filas || [];
    Object.keys(HIST).forEach(k => delete HIST[k]); Object.assign(HIST, j.historial || {});
    SYNC.hora = j.hora || hhmm(new Date());
    store.set('cache-pendientes', ROWS); store.set('cache-historial', HIST); store.set('cache-hora', SYNC.hora);
    if (!OUTBOX.length) SYNC.err = '';
    if (manual) toast(`Trabajos actualizados: ${ROWS.length}`);
  } catch (e) { SYNC.err = e.message; if (manual) toast(e.message); }
  SYNC.loading = false;
  if (S.view === 'pend' || (S.wiz && stepId() === 'partida')) render(); else updSync();
}
function buscarBobina(localId) {
  const all = [];
  if (S.corr) all.push(...S.corr.done);
  if (S.saved) all.push(S.saved);
  return all.find(b => b.localId === localId);
}
async function flush() {
  if (SYNC.busy || !CFG.url) { updSync(); return; }
  if (!OUTBOX.length) { updSync(); return; }
  SYNC.busy = true; updSync();
  let refrescar = false;
  try {
    while (OUTBOX.length) {
      const op = OUTBOX[0];
      if (op.tipo === 'bobina') {
        const j = await api('bobina', op.datos);
        LOTES[op.localId] = {lote: j.lote, n: j.n};
        const b = buscarBobina(op.localId);
        if (b) { b.lote = j.lote; b.n = j.n; }
        toast(`Bobina guardada en el Sheets como ${j.lote}`);
        refrescar = true;
      } else if (op.tipo === 'imprimir') {
        const l = LOTES[op.localId];
        if (!l) throw new Error('La bobina todavía no tiene lote');
        await api('imprimir', Object.assign({}, op.datos, {lote: l.lote, id: `${l.lote}-E${op.copia}`}));
        toast(`Etiqueta ${l.lote} enviada a la impresora`);
      } else if (op.tipo === 'cerrar') {
        await api('cerrar', op.datos);
      }
      OUTBOX.shift(); saveOut();
    }
    SYNC.err = '';
  } catch (e) { SYNC.err = e.message; }
  SYNC.busy = false;
  if (refrescar && (S.saved || (S.corr && S.corr.phase === 'cierre'))) render(); else updSync();
}
function encolar(op) { OUTBOX.push(op); saveOut(); flush(); }

  encolar({tipo: 'bobina', localId: b.localId, datos: {codigoMaquina: MAQS[S.maq].code, idRegistro: b.localId, fila, scrap}});

    <label class="field"><span>Clave</span>
      <input type="text" data-in="cfg.clave" value="${esc(d.clave)}" placeholder="La misma que pusiste en el script" autocomplete="off" spellcheck="false"></label>
    <div class="row"><button class="btn" data-act="cfgtest">Probar conexión</button><button class="btn go" data-act="cfgsave">Guardar</button></div>
    ${S.cfgMsg ? `<p class="hint cfgmsg">${S.cfgMsg}</p>` : ''}
    ${OUTBOX.length ? `<div class="warnbox"><b>${OUTBOX.length === 1 ? 'Hay 1 envío pendiente' : `Hay ${OUTBOX.length} envíos pendientes`}.</b><span>Se mandan solos cuando la conexión funcione.</span><div class="row"><button class="btn small" data-act="retry">Reintentar ahora</button></div></div>` : ''}
  </div></div>`;
}

/* ---------- render ---------- */
function render() {
  const scr = $('#scr');
  let html = bar() + (S.view === 'pend' ? `<div class="body">${pendHTML()}</div>` : S.view === 'config' ? configHTML() : cargaHTML());
  if (S.view === 'pend' && S.detail) html += detailHTML();
  if (S.view === 'carga') {
    if (S.drawer && S.cur) html += drawerHTML();
    if (S.modal && S.corr) html += modalHTML();
  }
  scr.innerHTML = html;
  if (S.view === 'carga' && S.corr && S.corr.phase === 'cierre') updateClose();
}
function updateFwd() {
  const f = $('#fwd'); if (f && S.wiz) f.disabled = !stepOk(stepId());
  document.querySelectorAll('[data-pf]').forEach(el => {
    const k = el.dataset.pf, c = ctx();
    if (k !== 'adFin' && c) el.classList.toggle('filled', c.params[k] !== '' && c.params[k] !== undefined);
  });
}

/* ---------- eventos ---------- */
const scr = $('#scr');
scr.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-k]'); if (!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.v, c = S.corr;
  if (b.dataset.k) {
    const t = b.dataset.t;
    if (t === 'peso') { S.cur.peso = padPress(S.cur.peso, b.dataset.k); S.cur.auth = false; S.cur.pinOpen = false; }
    else if (t === 'adIni') S.setup.adIni = padPress(S.setup.adIni, b.dataset.k);
    else S.sk.kg = padPress(S.sk.kg, b.dataset.k);
  }
  else if (a === 'view') { S.view = v; S.detail = null; if (v === 'config') { S.cfgDraft = null; S.cfgMsg = ''; } if (v === 'pend') cargarPendientes(); }
  else if (a === 'scope') S.scope = v;
  else if (a === 'detail') S.detail = Number(v);
  else if (a === 'closedetail') S.detail = null;
  else if (a === 'start') {
    const row = findRow(v);
    if (!S.wiz || !isFirst() || S.corr) startFirst(row); else setRow(row);
    S.wiz.i = S.cur.op ? STEPS_FIRST.findIndex(s => s[0] === 'orden') : 0;
    S.detail = null; S.view = 'carga';
  }
  else if (a === 'op') { S.cur.op = v; S.wiz.i++; }
  else if (a === 'pickrow') { setRow(findRow(v)); S.wiz.i++; }
  else if (a === 'mat') ctx().material = v;
  else if (a === 'userec') { ctx().params = {...ctx().hist.params}; ctx().histUsed = true; ctx().edited = false; }
  else if (a === 'pstep') {
    const tgt = b.dataset.p === 'p' ? ctx().params : S.modal.params, k = b.dataset.pk, st = stepOf(k);
    tgt[k] = Math.max(0, Math.round(((num(tgt[k]) || 0) + Number(b.dataset.d) * st) * 10) / 10);
    if (b.dataset.p === 'p') ctx().edited = true;
  }
  else if (a === 'manual') { ctx().params = {...MAQS[S.maq].base}; ctx().histUsed = false; ctx().edited = false; }
  else if (a === 'cono') { S.cur.cono = v; S.cur.auth = false; S.wiz.i++; }
  else if (a === 'reweigh') { S.cur.peso = ''; S.cur.auth = false; S.cur.pinOpen = false; }
  else if (a === 'pinopen') S.cur.pinOpen = true;
  else if (a === 'pinok') {
    if (S.cur.pin === PIN_SUP) { S.cur.auth = true; S.cur.pinOpen = false; toast('Peso autorizado por el supervisor'); }
    else { toast('PIN incorrecto'); S.cur.pin = ''; }
  }
  else if (a === 'back') S.wiz.i = Math.max(0, S.wiz.i - 1);
  else if (a === 'fwd') {
    if (stepId() !== 'guardar') S.wiz.i++;
    else {
      if (!S.corr) {
        const st = S.setup;
        S.corr = {...st, id: `${MAQS[S.maq].code}-${dKey(S.cur.t0)}-${pad2(S.cur.t0.getHours())}${pad2(S.cur.t0.getMinutes())}`, code: MAQS[S.maq].code, adFin:'', done:[], early:false, phase:'bobina',
          changes:[{t: hhmm(S.cur.t0), txt: (st.histUsed ? `Seteo inicial desde el historial (partida ${st.hist.partida})` : 'Seteo inicial con los promedios de la máquina') + (st.edited ? ', con ajustes' : '')}]};
        S.setup = null;
      }
      const x = pesoInfo(), bob = S.cur;
      Object.assign(bob, {n: nNow(), total: x.r[K.cant], lote: null, localId: newId(), peso: x.p, teo: x.teo, dev: x.dev, flag: flagOf(x.dev), t1: new Date()});
      S.corr.done.push(bob);
      enviarBobina(bob);
      toast(`Bobina ${bob.n}/${bob.total} guardada. Enviando al Sheets…`);
      S.saved = bob; S.cur = null; S.wiz = null; S.drawer = false;
    }
  }
  else if (a === 'cfgmaq') {
    if (S.corr && v !== S.maq) { toast('Cerrá la corrida abierta antes de cambiar de máquina'); return; }
    S.cfgDraft.maq = v;
  }
  else if (a === 'cfgtest' || a === 'cfgsave') {
    const d = S.cfgDraft, prev = {...CFG};
    Object.assign(CFG, {url: d.url.trim(), clave: d.clave.trim()});
    S.cfgMsg = 'Probando la conexión…'; render();
    api('ping').then(j => {
      S.cfgMsg = `Conectado a "${esc(j.hoja)}".`;
      if (a === 'cfgsave') {
        CFG.maq = d.maq; store.set('config', CFG);
        if (S.maq !== CFG.maq) { S.maq = CFG.maq; if (S.setup && S.setup.row && S.setup.row[K.lugar] !== S.maq) setRow(null); }
        S.cfgDraft = null; S.cfgMsg = ''; S.view = 'carga';
        toast('Configuración guardada'); cargarPendientes(); flush();
      } else Object.assign(CFG, prev);
      render();
    }).catch(e => { Object.assign(CFG, prev); S.cfgMsg = `No se pudo conectar: ${esc(e.message)}. Revisá la dirección y la clave.`; render(); });
    return;
  }
  else if (a === 'retry') { flush(); return; }
  else if (a === 'refresh') { cargarPendientes(true); return; }
  else if (a === 'install') {
    const e = S.installEvt; S.installEvt = null;
    if (e) { e.prompt(); e.userChoice.finally(render); } return;
  }
  else if (a === 'print') { printLabel(v ? c.done.find(x => x.localId === v) : S.saved); return; }
  else if (a === 'nextbob') { S.cur = newCur(S.saved); S.saved = null; S.wiz = {steps: STEPS_NEXT, i: 0}; }
  else if (a === 'early') { c.phase = 'cierre'; c.early = true; }
  else if (a === 'tocierre') { c.phase = 'cierre'; c.early = false; }
  else if (a === 'resume') { c.phase = 'bobina'; c.early = false; }
  else if (a === 'closecorr') {
    const r = c.row, kg = c.done.reduce((s, x) => s + x.peso, 0);
    enviarCierre(c);
    HIST[hkey(r)] = {partida: String(r[K.partida]), fecha: dShort(), maq: MAQS[S.maq].name, params: {...c.params}};
    r[K.hechas] += c.done.length;
    r[K.rest] = Math.max(0, r[K.cant] - r[K.hechas]);
    r[K.kgr] = Math.max(0, Math.round((r[K.kgr] - kg) * 100) / 100);
    if (r[K.rest] === 0) r[K.pend] = 'FALSO';
    toast(r[K.rest] === 0 ? `Partida ${r[K.partida]} completa` : `Corrida cerrada. ${r[K.rest] === 1 ? 'Falta 1 bobina' : `Faltan ${r[K.rest]} bobinas`} de la partida ${r[K.partida]}`);
    S.corr = null; S.saved = null; S.wiz = null; S.cur = null; S.view = 'pend';
  }
  else if (a === 'opendrawer') { S.drawer = true; S.sk = {motivo: null, kg: ''}; }
  else if (a === 'closedrawer') S.drawer = false;
  else if (a === 'motivo') S.sk.motivo = v;
  else if (a === 'addscrap') {
    S.cur.scrap.push({t: hhmm(new Date()), d: new Date(), motivo: S.sk.motivo, kg: num(S.sk.kg)});
    toast(`Scrap agregado a la bobina ${nNow()}/${rowNow()[K.cant]}`);
    S.sk = {motivo: null, kg: ''};
  }
  else if (a === 'delscrap') S.cur.scrap.splice(Number(v), 1);
  else if (a === 'openmodal') S.modal = {material: c.material, params: {...c.params}};
  else if (a === 'closemodal') S.modal = null;
  else if (a === 'mmat') S.modal.material = v;
  else if (a === 'savemodal') {
    const d = S.modal, diffs = [], from = S.cur ? `${nNow()}/${rowNow()[K.cant]}` : `${nNow()}/${rowNow()[K.cant]}`;
    if (d.material !== c.material) diffs.push(`Material de ${c.material} a ${d.material}`);
    PARAMS.forEach(([k, l]) => { if (d.params[k] !== '' && num(d.params[k]) !== num(c.params[k])) diffs.push(`${l} de ${fmtP(c.params[k])} a ${fmtP(d.params[k])}`); });
    if (diffs.length) {
      c.changes.unshift({t: hhmm(new Date()), txt: `${diffs.join(', ')}, desde la bobina ${from}`});
      c.material = d.material;
      PARAMS.forEach(([k]) => { if (d.params[k] !== '') c.params[k] = num(d.params[k]); });
      toast('Cambios guardados');
    }
    S.modal = null;
  }
  render();
});
scr.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('tr[data-act="detail"]')) { S.detail = Number(e.target.dataset.v); render(); }
});
scr.addEventListener('input', e => {
  const t = e.target, k = t.dataset.in; if (!k) return;
  if (k === 'q') { S.q = t.value; $('#tb').innerHTML = rowsHTML(); $('#count').textContent = `${visibleRows().length} trabajos`; return; }
  if (k === 'cfg.url' || k === 'cfg.clave') { S.cfgDraft[k.slice(4)] = t.value; return; }
  if (k === 'pin') { S.cur.pin = t.value; return; }
  if (/^[pm]\./.test(k)) t.value = t.value.replace(/[^0-9.,]/g, '').replace(/([.,]\d*)[.,]/g, '$1');
  const val = t.value.trim();
  if (k === 'adFin') { S.corr.adFin = val; updateClose(); return; }
  const [pre, pk] = k.split('.');
  if (pre === 'p') { ctx().params[pk] = val === '' ? '' : num(val); ctx().edited = true; updateFwd(); }
  if (pre === 'm') { S.modal.params[pk] = val === '' ? '' : num(val); }
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; render(); });
window.addEventListener('appinstalled', () => { S.installEvt = null; render(); toast('App instalada'); });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('online', flush);
setInterval(flush, 20000);
setInterval(() => { if (S.view === 'pend' && !S.detail) cargarPendientes(); }, 300000);
if (CFG.url) { cargarPendientes(); flush(); }
render();
setInterval(() => document.querySelectorAll('[data-clock]').forEach(c => c.textContent = hhmm(new Date())), 15000);
</script>
</body>
</html>
